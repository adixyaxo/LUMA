{% extends "layouts/auth_layout.html" %}

{% block title %}Log In — LUMA{% endblock %}

{% block auth_header %}
<h1 class="text-5xl font-light leading-tight tracking-tight">
  Welcome<br><span class="font-serif-italic text-[#5f61ed]">back.</span>
</h1>
<p class="mt-3 text-sm text-white/50 font-light">Log in to continue to LUMA.</p>
{% endblock %}

{% block auth_form %}
<form action="/login" method="POST" class="flex flex-col gap-7">

  <!-- Error Banner (Hidden by default, backend can remove 'hidden' class) -->
  <div class="hidden border-l-2 border-red-500 bg-red-500/5 text-white/80 px-4 py-3 text-xs font-mono-tech tracking-wide mb-[-1rem]">
    Invalid email or password.
  </div>

  <!-- Email -->
  <div class="flex flex-col gap-2">
    <label for="email" class="font-mono-tech text-[10px] tracking-widest uppercase text-white/40">Email</label>
    <input
      type="email" id="email" name="email" required
      placeholder="name@example.com"
      class="auth-input bg-transparent w-full py-3 text-sm text-white placeholder:text-white/20">
  </div>

  <!-- Password -->
  <div class="flex flex-col gap-2">
    <div class="flex justify-between items-center">
      <label for="password" class="font-mono-tech text-[10px] tracking-widest uppercase text-white/40">Password</label>
      <a href="#" class="form-link font-mono-tech text-[10px] tracking-widest uppercase text-white/30 hover:text-white/70">Forgot?</a>
    </div>
    <div class="relative w-full">
      <input
        type="password" id="password" name="password" required
        placeholder="••••••••"
        class="auth-input bg-transparent w-full py-3 pr-14 text-sm text-white placeholder:text-white/20">
      <button type="button" data-toggle="password" onclick="togglePasswordVisibility('password')"
        class="absolute right-0 top-1/2 -translate-y-1/2 font-mono-tech text-[10px] tracking-widest text-white/30 hover:text-white/70 transition-colors uppercase">
        Show
      </button>
    </div>
  </div>

  <!-- Submit -->
  <button type="submit"
    class="mt-6 w-full py-4 rounded-full bg-transparent text-white/90 text-sm font-normal border border-white/30 transition-all duration-800 ease-[cubic-bezier(0.19,1,0.22,1)] hover:bg-white hover:text-black hover:border-white focus:outline-none focus:ring-2 focus:ring-white/50 focus:ring-offset-2 focus:ring-offset-black flex items-center justify-center">
    <span>Log In</span>
  </button>

</form>

<!-- Switch Link -->
<p class="mt-8 text-center text-xs text-white/40 font-light">
  No account?
  <a href="/signup" class="form-link text-white/80 hover:text-white ml-1 font-medium focus:outline-none focus:text-white">Sign up</a>
</p>
{% endblock %}
