<!DOCTYPE html>
<html lang="en" class="bg-[#030712] text-white antialiased m-0 p-0 h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found — LUMA</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fragment+Mono:ital@0;1&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/output.css') }}">
</head>
<body class="h-full font-sans overflow-hidden bg-[#030712] selection:bg-white/30 selection:text-white flex flex-col justify-center items-center relative">

  <!-- Auras -->
  <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-[#5f61ed]/20 rounded-full blur-[120px] pointer-events-none z-0"></div>
  <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] bg-white/5 rounded-full blur-[80px] pointer-events-none z-0"></div>

  <!-- Noise Overlay -->
  <div class="fixed inset-0 z-50 pointer-events-none opacity-20 mix-blend-overlay" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>

  <div class="relative z-10 flex flex-col items-center text-center px-6">
    <div class="mb-6 font-mono-tech text-xs tracking-widest uppercase text-white/40 border border-white/10 rounded-full px-4 py-1.5 glass-card">
      Error 404
    </div>
    
    <h1 class="text-7xl md:text-9xl font-light tracking-tight leading-none mb-6">
      Signal <span class="font-serif-italic text-[#5f61ed]">lost.</span>
    </h1>
    
    <p class="text-white/50 text-sm md:text-base font-light max-w-md mx-auto mb-12">
      The channel you are looking for does not exist, has been archived, or you lack the clearance to access it.
    </p>

    <a href="/" class="btn-ghost inline-flex items-center justify-center border border-white/30 text-white/90 rounded-full px-10 py-4 text-sm font-normal hover:bg-white hover:text-black hover:border-white focus:outline-none focus:ring-2 focus:ring-white/50 focus:ring-offset-2 focus:ring-offset-black transition-all duration-500 ease-[cubic-bezier(0.19,1,0.22,1)]">
      Return to Base
    </a>
  </div>
</body>
</html>
