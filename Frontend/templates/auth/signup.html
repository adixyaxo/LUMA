{% extends "layouts/auth_layout.html" %}

{% block title %}Sign Up — LUMA{% endblock %}

{% block auth_header %}
<h1 class="text-5xl font-light leading-tight tracking-tight">
  Join<br><span class="font-serif-italic text-[#006fff]">LUMA.</span>
</h1>
<p class="mt-3 text-sm text-white/50 font-light">Create your account. It only takes a moment.</p>
{% endblock %}

{% block auth_form %}
<form action="/signup" method="POST" class="flex flex-col gap-7">

  <!-- Error Banner (Hidden by default, backend can remove 'hidden' class) -->
  <div
    class="hidden border-l-2 border-red-500 bg-red-500/5 text-white/80 px-4 py-3 text-xs font-mono-tech tracking-wide mb-[-1rem]">
    Please fill in all required fields.
  </div>

  <!-- Full Name -->
  <div class="flex flex-col gap-2">
    <label for="full_name" class="font-mono-tech text-[10px] tracking-widest uppercase text-white/40">Full Name</label>
    <input type="text" id="name" name="full_name" required placeholder="Jane Doe"
      class="auth-input bg-transparent w-full py-3 text-sm text-white placeholder:text-white/20">
  </div>

  <!-- Email -->
  <div class="flex flex-col gap-2">
    <label for="email" class="font-mono-tech text-[10px] tracking-widest uppercase text-white/40">Email</label>
    <input type="email" id="email" name="email" required placeholder="name@example.com"
      class="auth-input bg-transparent w-full py-3 text-sm text-white placeholder:text-white/20">
  </div>

  <!-- Password -->
  <div class="flex flex-col gap-2">
    <label for="password" class="font-mono-tech text-[10px] tracking-widest uppercase text-white/40">Password</label>
    <div class="relative w-full">
      <input type="password" id="password" name="password" required placeholder="••••••••"
        class="auth-input bg-transparent w-full py-3 pr-14 text-sm text-white placeholder:text-white/20">
      <button type="button" data-toggle="password" onclick="togglePasswordVisibility('password')"
        class="absolute right-0 top-1/2 -translate-y-1/2 font-mono-tech text-[10px] tracking-widest text-white/30 hover:text-white/70 transition-colors uppercase">
        Show
      </button>
    </div>
  </div>

  <!-- Submit -->
  <button type="submit"
    class="mt-6 w-full py-4 rounded-full bg-white text-black text-sm font-medium border border-transparent transition-all duration-800 ease-[cubic-bezier(0.19,1,0.22,1)] hover:bg-transparent hover:text-white hover:border-white/50 focus:outline-none focus:ring-2 focus:ring-white/50 focus:ring-offset-2 focus:ring-offset-black flex items-center justify-center">
    <span>Create Account</span>
  </button>

</form>

<!-- Switch Link -->
<p class="mt-8 text-center text-xs text-white/40 font-light">
  Already have an account?
  <a href="/login"
    class="form-link text-white/80 hover:text-white ml-1 font-medium focus:outline-none focus:text-white">Log in</a>
</p>
{% endblock %}
