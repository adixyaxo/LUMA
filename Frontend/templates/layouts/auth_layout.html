<!DOCTYPE html>
<html lang="en" class="min-h-screen bg-black text-[#f7f7f7] antialiased m-0 p-0">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}LUMA{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://unpkg.com/sheryjs/dist/Shery.css" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/output.css') }}?v=2">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: transparent !important;
    }

    .font-serif-italic {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
    }

    .font-mono-tech {
      font-family: 'Fragment Mono', monospace;
    }

    /* Underline link */
    .form-link {
      position: relative;
      transition: color 0.3s;
    }
    .form-link::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 0;
      height: 1px;
      background: currentColor;
      transition: width 0.5s cubic-bezier(0.19, 1, 0.22, 1);
    }
    .form-link:hover::after { width: 100%; }

    /* Input focus animation */
    .auth-input {
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding-left: 1rem;
      padding-right: 1rem;
      transition: border-color 0.4s cubic-bezier(0.19, 1, 0.22, 1), background-color 0.4s;
    }
    .auth-input:focus { 
      border-color: rgba(255,255,255,0.5); 
      outline: none; 
      background-color: rgba(255,255,255,0.03); 
    }
    .auth-input-error {
      border-color: rgba(239, 68, 68, 0.6) !important;
    }
    .auth-input-error:focus {
      border-color: rgba(239, 68, 68, 1) !important;
    }

    /* Primary auth button overrides */
    button[type="submit"] {
      border-radius: 12px !important;
    }
  </style>
</head>

<body class="min-h-screen bg-black text-[#f7f7f7] m-0 p-0 flex flex-col relative items-center justify-center overflow-x-hidden">

  <!-- Top Navigation Bar -->
  <header class="absolute top-0 left-0 w-full h-[80px] px-8 md:px-12 flex justify-between items-center z-50">
    <a href="/" class="text-sm font-bold tracking-widest text-white focus:outline-none focus:text-white/80">LUMA</a>
    <nav class="flex gap-8 text-xs font-medium tracking-widest uppercase text-white/60">
      <a href="/" class="hover:text-white transition-colors duration-300 focus:outline-none focus:text-white">Home</a>
      <a href="/about" class="hover:text-white transition-colors duration-300 focus:outline-none focus:text-white">About</a>
    </nav>
  </header>

  <!-- Main Form Area -->
  <main class="w-full max-w-md px-6 z-20 mt-12 md:mt-0">
    <!-- Form Header -->
    <div class="mb-10 text-center">
      {% block auth_header %}{% endblock %}
    </div>

    <!-- Form Body -->
    {% block auth_form %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="absolute bottom-0 w-full h-[60px] flex items-center justify-center gap-6 z-50 text-[10px] text-white/30 tracking-widest uppercase font-mono-tech pb-4">
    <span>LUMA Digital</span>
    <span>© 2026</span>
  </footer>

  <script>
    function togglePasswordVisibility(inputId) {
      const input = document.getElementById(inputId);
      const btn = document.querySelector(`[data-toggle="${inputId}"]`);
      if (input.type === 'password') {
        input.type = 'text';
        if (btn) btn.textContent = 'HIDE';
      } else {
        input.type = 'password';
        if (btn) btn.textContent = 'SHOW';
      }
    }
  </script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script type="text/javascript" src="https://unpkg.com/sheryjs/dist/Shery.js"></script>
  <script>
    Shery.makeMagnet("header a, button[type='submit']", {
      ease: "cubic-bezier(0.23, 1, 0.320, 1)",
      duration: 1,
    });
  </script>
</body>
</html>
